spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexoradb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

paystack:
  enabled: ${PAYSTACK_ENABLED:false}
  base-url: https://api.paystack.co
  secret-key: ${PAYSTACK_SECRET_KEY:}
  connect-timeout: 3s
  read-timeout: 10s

logging:
  level:
    org.hibernate.SQL: DEBUG