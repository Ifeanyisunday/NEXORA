spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/nexoradb_test}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 15m