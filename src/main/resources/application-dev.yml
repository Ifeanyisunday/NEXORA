
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexoradb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.hibernate.SQL: DEBUG
